name: Ruff signal audit (diagnostic only)

on:
  push:
    branches:
      - chore/ruff-signal-audit

permissions:
  contents: read

jobs:
  ruff-report:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pinned Ruff
        run: python -m pip install ruff==0.17.3
      - name: Report findings without edits or enforcement
        run: |
          ruff --version
          echo "== Conservative correctness candidates =="
          ruff check python tests --select F821,F822,F823,F841 --statistics --exit-zero
          echo "== Pyflakes summary =="
          ruff check python tests --select F --statistics --exit-zero
          echo "== Simplification and modern syntax =="
          ruff check python tests --select B,SIM,UP --statistics --exit-zero
          echo "== Representative source locations =="
          ruff check python tests --select F,B,SIM,UP --output-format concise --exit-zero | sed -n '1,100p'
